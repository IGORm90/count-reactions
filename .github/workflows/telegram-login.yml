name: "Telegram Login: Step 1 - Send Code"

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Phone number (e.g. +79991234567)'
        required: true

jobs:
  send-code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, curl, intl, gmp, xml, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/telegram storage/framework/{cache,sessions,views}

      - name: Send login code
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: php artisan telegram:login --phone="${{ inputs.phone }}"

      - name: Upload partial session
        uses: actions/upload-artifact@v4
        with:
          name: telegram-session
          path: storage/app/telegram/
          retention-days: 1
