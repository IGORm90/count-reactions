name: Telegram Login (QR)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, curl, intl, gmp, xml, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/telegram storage/framework/{cache,sessions,views}

      - name: Login via QR code
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: php artisan telegram:login

      - name: Encrypt and commit session
        run: |
          tar cz --exclude='*.ipc' -C storage/app/telegram . | openssl enc -aes-256-cbc -pbkdf2 -pass "pass:${{ secrets.TG_SESSION_PASSPHRASE }}" -out .github/session.enc
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/session.enc
          git diff --cached --quiet || git commit -m "chore: update Telegram session from CI"
          git push
