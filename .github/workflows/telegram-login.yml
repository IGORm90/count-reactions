name: Telegram Login

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Step: "phone" to send code, "code" to complete login'
        required: true
        type: choice
        options:
          - phone
          - code
      value:
        description: 'Phone number (for step=phone) or verification code (for step=code)'
        required: true
      password:
        description: '2FA password (if enabled, only for step=code)'
        required: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, curl, intl, gmp, xml, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: cp .env.example .env

      - name: Create storage directories
        run: mkdir -p storage/app/telegram storage/framework/{cache,sessions,views}

      - name: Restore session (if exists)
        if: inputs.step == 'code'
        run: |
          if [ -f .github/session.enc ]; then
            openssl enc -aes-256-cbc -pbkdf2 -d -pass "pass:${{ secrets.TG_SESSION_PASSPHRASE }}" -in .github/session.enc | tar xz -C storage/app/telegram/ || true
          fi

      - name: Send login code
        if: inputs.step == 'phone'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: php artisan telegram:login --phone="${{ inputs.value }}"

      - name: Complete login
        if: inputs.step == 'code'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          ARGS="--code=${{ inputs.value }}"
          if [ -n "${{ inputs.password }}" ]; then
            ARGS="$ARGS --password=${{ inputs.password }}"
          fi
          php artisan telegram:login $ARGS

      - name: Encrypt and commit session
        run: |
          tar cz --exclude='*.ipc' -C storage/app/telegram . | openssl enc -aes-256-cbc -pbkdf2 -pass "pass:${{ secrets.TG_SESSION_PASSPHRASE }}" -out .github/session.enc
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/session.enc
          git diff --cached --quiet || git commit -m "chore: update Telegram session from CI"
          git push
